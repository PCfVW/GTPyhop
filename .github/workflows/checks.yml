# Repository checks that run on every push and pull request.
#
# The other three workflows in this directory are publish-only: they trigger on
# a version tag and upload to PyPI. Nothing ran on ordinary pushes, so a broken
# link, a domain that had drifted from its own documentation, or a failing
# doctest could sit in the branch until release day. This closes that gap.
#
# Every step here is offline and deterministic — no network, no PyPI, no
# secrets — so it is safe to run on pull requests from forks.
name: Checks

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install both packages (editable)
        # Editable on purpose: it is what a contributor has, and it is the
        # configuration in which `import gtpyhop.examples` was broken before
        # gtpyhop-core 2.0.1. Installing wheels here would hide that class of
        # regression, because wheels merge the two trees on disk.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e packages/gtpyhop-core -e packages/gtpyhop-examples

      - name: gtpyhop.examples resolves on an editable install
        run: python -c "import gtpyhop, gtpyhop.examples; print(gtpyhop.__version__, gtpyhop.examples.__path__[0])"

      - name: Auditor self-test
        # The auditor gates the two steps below, so it is checked first: a
        # checker that has silently stopped checking passes everything.
        run: python -m gtpyhop.examples.audit.selftest

      - name: Audit every bundled example
        # Enforced families only (STRUCTURE, SEMANTICS, BEHAVIOUR). HYGIENE and
        # INFO are advisory and do not fail the build; see the auditor README.
        # The tree is at zero enforced findings, so any new one fails here.
        run: python tools/domain_audit.py --all

      - name: Audit internal documentation links
        run: python tools/link_audit.py

      - name: Doctests
        # Imports each module by its real dotted name rather than by filename,
        # so a module that is only importable through its package is tested
        # rather than mistaken for a failure. Prints the total, which is the
        # number the README's doctests badge claims.
        run: python tools/doctest_audit.py

      - name: Example regression tests
        run: python -m gtpyhop.examples.regression_tests
