name: Build and Publish to PyPI

# Dynamic per-run title for the Actions UI. Prepends "[DRY RUN]" when the
# workflow was dispatched manually with dry_run=true (the default), so a
# successful run does NOT visually claim a publish actually happened.
# Tag-triggered runs and explicit dry_run=false runs render as "Publish to
# PyPI <ref>". github.ref_name is the tag for tag pushes (e.g. v2.0.0) and
# the branch name for manual runs (e.g. pip).
run-name: >-
  ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true')
      && format('[DRY RUN] Build and validate {0}', github.ref_name)
      || format('Publish to PyPI {0}', github.ref_name) }}

on:
  push:
    # Publish to PyPI only on release tags of the form vMAJOR.MINOR.PATCH
    # (e.g. v1.9.6, v2.0.0, v1.10.25). A single tag publishes all three
    # packages below, since they're released in lockstep at the same
    # version number.
    #
    # Milestone and pre-release tags that carry a hyphenated suffix are
    # git-level checkpoints ONLY -- they do NOT publish to PyPI:
    #   v1.9.6-rc1          (release candidate, if ever adopted)
    #   v1.9.6-staging      (staging checkpoint before publish)
    #   v2.0.0-beta.1       (beta tag)
    #
    # NOTE: GitHub Actions does not allow `tags` and `tags-ignore` on the same
    # event. Use a single `tags:` list with `!`-prefixed exclusions instead.
    # See https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#onpushbranchestagsbranches-ignoretags-ignore
    #
    # To publish a hyphenated tag intentionally (or to re-trigger a publish),
    # use the `workflow_dispatch` trigger below (manual run from the Actions tab).
    tags:
      - "v*"
      - "!v*-*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: build, validate, and run all checks, but do NOT upload to PyPI'
        type: boolean
        default: true

# Why each package has BOTH a build job and a publish job:
#
# PyPI's trusted publishing cannot authenticate an upload made from inside a
# reusable workflow -- the token exchange matches `job_workflow_ref` (the
# reusable file) while attestation verification matches `workflow_ref` (this
# file), and with a reusable workflow those differ by construction, so one
# check always disagrees. Confirmed against PyPI from both directions on
# 2026-07-31. The publish steps therefore live HERE, in the top-level
# workflow, where the two claims are the same file -- which is also the
# filename each package's Trusted Publisher on PyPI is configured with.
# See https://github.com/pypi/warehouse/issues/11096.
#
# Builds run in parallel (building a package never needs another to be on
# PyPI first -- `python -m build` only installs build backends). Publishing
# is what must be ordered: gtpyhop-examples and gtpyhop declare an
# exact-pinned dependency on gtpyhop-core's version, so that version has to
# exist on PyPI before either of them is published, or they would ship a
# broken transitive install.

jobs:
  build-gtpyhop-core:
    uses: ./.github/workflows/publish-one-package.yml
    with:
      package_name: gtpyhop-core
      package_dir: gtpyhop-core
      dry_run: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' }}

  build-gtpyhop-examples:
    uses: ./.github/workflows/publish-one-package.yml
    with:
      package_name: gtpyhop-examples
      package_dir: gtpyhop-examples
      dry_run: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' }}

  build-gtpyhop:
    uses: ./.github/workflows/publish-one-package.yml
    with:
      package_name: gtpyhop
      package_dir: gtpyhop
      dry_run: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' }}

  # Published first: the other two exact-pin this version.
  publish-gtpyhop-core:
    needs: build-gtpyhop-core
    if: ${{ !(github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true') }}
    runs-on: ubuntu-latest
    environment: pypi-release-gtpyhop-core
    permissions:
      id-token: write
    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-gtpyhop-core.outputs.artifact_name }}
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  publish-gtpyhop-examples:
    needs: [build-gtpyhop-examples, publish-gtpyhop-core]
    if: ${{ !(github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true') }}
    runs-on: ubuntu-latest
    environment: pypi-release-gtpyhop-examples
    permissions:
      id-token: write
    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-gtpyhop-examples.outputs.artifact_name }}
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  # Published last: the meta-package depends on both of the above.
  publish-gtpyhop:
    needs: [build-gtpyhop, publish-gtpyhop-examples]
    if: ${{ !(github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true') }}
    runs-on: ubuntu-latest
    environment: pypi-release-of-the-pip-branch
    permissions:
      id-token: write
    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-gtpyhop.outputs.artifact_name }}
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
