name: Build and Publish to PyPI

on:
  push:
    branches:
      - pip
    paths:
      - 'pyproject.toml'

jobs:
  check-and-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment: pypi-release-of-the-pip-branch
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # Ensures previous commit is available

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: python -m pip install --upgrade pip build packaging

      - name: Get current version from pyproject.toml
        id: current_version
        run: |
          current_version=$(python -c "import re; content=open('pyproject.toml').read(); print(re.search(r'version\s*=\s*[\"\'](.*?)[\"\']', content).group(1))")
          echo "version=$current_version" >> $GITHUB_OUTPUT

      - name: Get previous version from pyproject.toml
        id: previous_version
        run: |
          prev_version=$(git show HEAD~1:pyproject.toml | python -c "import re, sys; content=sys.stdin.read(); print(re.search(r'version\s*=\s*[\"\'](.*?)[\"\']', content).group(1))")
          echo "version=$prev_version" >> $GITHUB_OUTPUT

      - name: Check if version changed and is greater
        id: version_check
        run: |
          echo "Current version: ${{ steps.current_version.outputs.version }}"
          echo "Previous version: ${{ steps.previous_version.outputs.version }}"

          # Use Python to compare versions properly
          python -c "
          from packaging import version
          import sys

          current = '${{ steps.current_version.outputs.version }}'
          previous = '${{ steps.previous_version.outputs.version }}'

          print(f'Comparing versions: {current} vs {previous}')

          if current == previous:
              print('Version did not change. Skipping publish.')
              sys.exit(1)
          elif version.parse(current) > version.parse(previous):
              print('New version is greater. Proceeding with the publication of GTPyhop on PyPI.')
              sys.exit(0)
          else:
              print('Error: New version is not greater than the previous version. Please ensure the version number is incremented.')
              sys.exit(1)
          "

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
