name: Build and Publish to PyPI

on:
  push:
    branches:
      - pip
    paths:
      - 'pyproject.toml'

jobs:
  check-and-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment: pypi-release-of-the-pip-branch
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # Ensures previous commit is available

      - name: Get current version from pyproject.toml
        id: current_version
        run: |
          current_version=$(grep -Po '(?<=version = ")[^"]*' pyproject.toml)
          echo "version=$current_version" >> $GITHUB_OUTPUT

      - name: Get previous version from pyproject.toml
        id: previous_version
        run: |
          prev_version=$(git show HEAD~1:pyproject.toml | grep -Po '(?<=version = ")[^"]*')
          echo "version=$prev_version" >> $GITHUB_OUTPUT

      - name: Check if version changed and is greater
        id: version_check
        run: |
          echo "Current version: ${{ steps.current_version.outputs.version }}"
          echo "Previous version: ${{ steps.previous_version.outputs.version }}"
          if [ "${{ steps.current_version.outputs.version }}" == "${{ steps.previous_version.outputs.version }}" ]; then
            echo "Version did not change. Skipping publish."
            exit 1
          fi
            
          # Use Python to compare versions properly
          if python -c "from packaging import version; exit(0 if version.parse('${{ steps.current_version.outputs.version }}') > version.parse('${{ steps.previous_version.outputs.version }}') else 1)"; then
            echo "New version is greater. Proceeding with the publication of GTPyhop on PyPI."
          else
            echo "Error: New version is not greater than the previous version. Please ensure the version number is incremented."
            exit 1
          fi
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: python -m pip install --upgrade pip build packaging

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
