name: Build and Publish to PyPI

# Dynamic per-run title for the Actions UI. Prepends "[DRY RUN]" when the
# workflow was dispatched manually with dry_run=true (the default), so a
# successful run does NOT visually claim a publish actually happened.
# Tag-triggered runs and explicit dry_run=false runs render as "Publish to
# PyPI <ref>". github.ref_name is the tag for tag pushes (e.g. v2.0.0) and
# the branch name for manual runs (e.g. pip).
run-name: >-
  ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true')
      && format('[DRY RUN] Build and validate {0}', github.ref_name)
      || format('Publish to PyPI {0}', github.ref_name) }}

on:
  push:
    # Publish to PyPI only on release tags of the form vMAJOR.MINOR.PATCH
    # (e.g. v1.9.6, v2.0.0, v1.10.25). A single tag publishes all three
    # packages below, since they're released in lockstep at the same
    # version number.
    #
    # Milestone and pre-release tags that carry a hyphenated suffix are
    # git-level checkpoints ONLY -- they do NOT publish to PyPI:
    #   v1.9.6-rc1          (release candidate, if ever adopted)
    #   v1.9.6-staging      (staging checkpoint before publish)
    #   v2.0.0-beta.1       (beta tag)
    #
    # NOTE: GitHub Actions does not allow `tags` and `tags-ignore` on the same
    # event. Use a single `tags:` list with `!`-prefixed exclusions instead.
    # See https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#onpushbranchestagsbranches-ignoretags-ignore
    #
    # To publish a hyphenated tag intentionally (or to re-trigger a publish),
    # use the `workflow_dispatch` trigger below (manual run from the Actions tab).
    tags:
      - "v*"
      - "!v*-*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: build, validate, and run all checks, but do NOT upload to PyPI'
        type: boolean
        default: true

jobs:
  # Published first: gtpyhop-examples and gtpyhop both declare an exact-pinned
  # dependency on this package's version, so it must exist on PyPI before
  # either of them is published, or they'd ship a broken transitive install.
  publish-gtpyhop-core:
    uses: ./.github/workflows/publish-one-package.yml
    with:
      package_name: gtpyhop-core
      package_dir: gtpyhop-core
      environment_name: pypi-release-gtpyhop-core
      dry_run: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' }}
    permissions:
      id-token: write
      contents: read

  publish-gtpyhop-examples:
    needs: publish-gtpyhop-core
    uses: ./.github/workflows/publish-one-package.yml
    with:
      package_name: gtpyhop-examples
      package_dir: gtpyhop-examples
      environment_name: pypi-release-gtpyhop-examples
      dry_run: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' }}
    permissions:
      id-token: write
      contents: read

  # Published last: the meta-package depends on both of the above.
  publish-gtpyhop:
    needs: publish-gtpyhop-examples
    uses: ./.github/workflows/publish-one-package.yml
    with:
      package_name: gtpyhop
      package_dir: gtpyhop
      environment_name: pypi-release-of-the-pip-branch
      dry_run: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' }}
    permissions:
      id-token: write
      contents: read
