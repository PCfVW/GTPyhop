[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gtpyhop-core"
version = "2.0.0"
description = "GTPyhop planner core (no bundled examples) - a Goal-Task-Network planning package written in Python"
readme = "README.md"
authors = [
    # Packaging author:
    #   - this toml file,
    #   - new folder names and new package folder structure,
    #   - greedy iterative_seek_plan
    #   - backtracking iterative_seek_plan
    #   - session-based architecture
    #   - structured logging
    #   - plan validation
    #   - new examples (IPC 2020 Total Order, MCP orchestration, memory tracking, poetry,
    #     Control Arena protocols + threat-model variety extension, cybersecurity attack planning,
    #     Android: Netrunner, Trunk Thumper game-AI, and Colt Express board-game)
    #   - documentation style guides for domains, problems, actions, methods, and new examples
    #   - the gtpyhop-core / gtpyhop-examples / gtpyhop package split
    { name = "Eric Jacopin", email = "eric.jacopin@protonmail.com" },

    # Original author
    { name = "Dana Nau", email = "nau@umd.edu" },
]
license = { text = "Clear BSD License" }
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]
keywords = ["Planning", "HTN", "Artificial Intelligence", "Automated Planning"]
requires-python = ">=3.8"
dependencies = [
    "psutil>=5.8.0",
]

[project.urls]
Homepage = "https://github.com/PCfVW/GTPyhop/tree/pip"
Documentation = "https://github.com/dananau/GTPyhop/blob/main/additional_information.md"
Repository = "https://github.com/PCfVW/GTPyhop.git"
Issues = "https://github.com/PCfVW/GTPyhop/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/gtpyhop"]
