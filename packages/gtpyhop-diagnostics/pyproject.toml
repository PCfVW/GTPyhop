[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gtpyhop-diagnostics"
version = "0.1.0"
description = "Failure attribution for GTPyhop plans: name the precondition that blocked the search"
readme = "README.md"
authors = [
    { name = "Eric Jacopin", email = "eric.jacopin@protonmail.com" },
]
license = { text = "Clear BSD License" }
classifiers = [
    # Deliberately not 5 - Production/Stable like the other three: the static
    # analysis here is new and its idiom coverage will grow with real use.
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]
keywords = ["Planning", "HTN", "Artificial Intelligence", "Automated Planning", "Diagnostics"]
requires-python = ">=3.8"
# A lower bound rather than the exact pin gtpyhop-examples and the gtpyhop
# meta-package use: those ship in lockstep as one release, whereas this is an
# optional add-on with its own cadence. It needs TraceEvent.state, which
# arrived in 2.0.0.
dependencies = [
    "gtpyhop-core>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/PCfVW/GTPyhop/tree/pip"
Documentation = "https://github.com/PCfVW/GTPyhop/blob/pip/packages/gtpyhop-diagnostics/README.md"
Repository = "https://github.com/PCfVW/GTPyhop.git"
Issues = "https://github.com/PCfVW/GTPyhop/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/gtpyhop"]
