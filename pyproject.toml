[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gtpyhop"
version = "1.1.1b6"
description= "A Goal-Task-Network planning system written in Python"
readme = "README.md"
authors = [
    { name = "Dana Nau", email = "nau@umd.edu" },

    # Packaging author (this toml file, new folder names and new package folder structure)
    { name = "Eric Jacopin", email = "eric.jacopin@protonmail.com" },
]
license = { text = "Clear BSD License" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]
keywords = ["Planning", "HTN", "Artificial Intelligence", "Automated Planning"]
requires-python = ">=3"
dependencies = []

[project.urls]
Homepage = "https://github.com/dananau/gtpyhop"
Documentation = "https://github.com/dananau/GTPyhop/blob/main/additional_information.md"
Repository = "https://github.com/dananau/gtpyhop.git"
Issues = "https://github.com/dananau/gtpyhop/issues"
